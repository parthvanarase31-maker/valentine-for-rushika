<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine ❤️</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 30px 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h1 {
      color: #e63946;
      margin-bottom: 20px;
    }

    .buttons {
      margin-top: 30px;
      position: relative;
      height: 80px;
    }

    button {
      padding: 12px 25px;
      font-size: 16px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: 0.3s;
    }

    #yesBtn {
      background: #e63946;
      color: white;
      margin-right: 15px;
    }

    #yesBtn:hover {
      background: #d62839;
    }

    #noBtn {
      background: #adb5bd;
      color: #333;
      position: absolute;
    }

    .message {
      margin-top: 20px;
      font-size: 18px;
      color: #2a9d8f;
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Rushika ❤️</h1>
    <p>Will you be my Valentine? 💖</p>

    <div class="buttons">
      <button id="yesBtn">Yes 😍</button>
      <button id="noBtn">No 🙄</button>
    </div>

    <div class="message" id="message">
      Yayyy! 💕  
      I knew you’d say YES 😘  
      Happy Valentine’s Day ❤️
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const message = document.getElementById("message");

    noBtn.style.left = "120px";

    noBtn.addEventListener("mouseover", () => {
      const x = Math.random() * 250;
      const y = Math.random() * 60;

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    });

    yesBtn.addEventListener("click", () => {
      message.style.display = "block";
    });
  </script>

</body>
</html>
