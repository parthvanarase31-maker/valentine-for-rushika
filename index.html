<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 360px;
      position: relative;
    }

    h1 {
      color: #e63946;
      margin-bottom: 10px;
    }

    p {
      font-size: 16px;
    }

    .buttons {
      margin-top: 25px;
      position: relative;
      height: 140px;
    }

    button {
      padding: 14px 28px;
      font-size: 16px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      position: absolute;
      touch-action: manipulation;
    }

    #yesBtn {
      background: #e63946;
      color: white;
      left: 20px;
      top: 50px;
      z-index: 2;
    }

    #noBtn {
      background: #adb5bd;
      color: #333;
      left: 190px;
      top: 50px;
      z-index: 1;
    }

    .message {
      margin-top: 20px;
      font-size: 18px;
      color: #2a9d8f;
      display: none;
    }

    /* ❤️ Floating hearts */
    .heart {
      position: fixed;
      bottom: 0;
      font-size: 20px;
      animation: floatUp 4s linear forwards;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translateY(-100vh) scale(1.5);
        opacity: 0;
      }
    }

    @media (max-width: 380px) {
      #yesBtn { left: 10px; }
      #noBtn { left: 170px; }
    }
  </style>
</head>
<body>

  <!-- 🎵 Background Music -->
  <audio id="bgMusic" loop>
    <!-- Replace this link with any romantic MP3 you like -->
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  </audio>

  <div class="card">
    <h1>Rushika ❤️</h1>
    <p>Will you be my Valentine? 💖</p>

    <div class="buttons" id="btnArea">
      <button id="yesBtn">Yes 😍</button>
      <button id="noBtn">No 🙄</button>
    </div>

    <div class="message" id="message">
      Yayyy! 💕<br>
      I knew you’d say YES 😘<br>
      Happy Valentine’s Day ❤️
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const btnArea = document.getElementById("btnArea");
    const message = document.getElementById("message");
    const music = document.getElementById("bgMusic");

    function moveNoButton() {
      const areaW = btnArea.clientWidth;
      const areaH = btnArea.clientHeight;
      const noW = noBtn.offsetWidth;
      const noH = noBtn.offsetHeight;

      const yesX = yesBtn.offsetLeft;
      const yesY = yesBtn.offsetTop;
      const yesW = yesBtn.offsetWidth;
      const yesH = yesBtn.offsetHeight;

      let x, y, safe = false;

      while (!safe) {
        x = Math.random() * (areaW - noW);
        y = Math.random() * (areaH - noH);

        const overlap =
          x + noW > yesX &&
          x < yesX + yesW &&
          y + noH > yesY &&
          y < yesY + yesH;

        if (!overlap) safe = true;
      }

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    noBtn.addEventListener("mouseenter", moveNoButton);
    noBtn.addEventListener("touchstart", (e) => {
      e.preventDefault();
      moveNoButton();
    });

    function createHeart() {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.innerText = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (20 + Math.random() * 20) + "px";
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 4000);
    }

    yesBtn.addEventListener("click", () => {
      message.style.display = "block";

      // 🎵 Play music (mobile-safe)
      music.play();

      // 💖 Heart burst
      for (let i = 0; i < 30; i++) {
        setTimeout(createHeart, i * 100);
      }
    });
  </script>

</body>
</html>
