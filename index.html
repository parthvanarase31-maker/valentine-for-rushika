<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 360px;
    }

    h1 {
      color: #e63946;
      margin-bottom: 10px;
    }

    p {
      font-size: 16px;
    }

    .buttons {
      margin-top: 25px;
      position: relative;
      height: 140px;
    }

    button {
      padding: 14px 28px;
      font-size: 16px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      position: absolute;
      touch-action: manipulation;
    }

    #yesBtn {
      background: #e63946;
      color: white;
      left: 20px;
      top: 50px;
      z-index: 2;
    }

    #noBtn {
      background: #adb5bd;
      color: #333;
      left: 190px;
      top: 50px;
      z-index: 1;
    }

    .message {
      margin-top: 20px;
      font-size: 18px;
      color: #2a9d8f;
      display: none;
    }

    /* Small screen adjustments */
    @media (max-width: 380px) {
      #yesBtn {
        left: 10px;
      }
      #noBtn {
        left: 170px;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Rushika ❤️</h1>
    <p>Will you be my Valentine? 💖</p>

    <div class="buttons" id="btnArea">
      <button id="yesBtn">Yes 😍</button>
      <button id="noBtn">No 🙄</button>
    </div>

    <div class="message" id="message">
      Yayyy! 💕<br>
      I knew you’d say YES 😘<br>
      Happy Valentine’s Day ❤️
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const btnArea = document.getElementById("btnArea");
    const message = document.getElementById("message");

    function moveNoButton() {
      const areaW = btnArea.clientWidth;
      const areaH = btnArea.clientHeight;

      const noW = noBtn.offsetWidth;
      const noH = noBtn.offsetHeight;

      const yesX = yesBtn.offsetLeft;
      const yesY = yesBtn.offsetTop;
      const yesW = yesBtn.offsetWidth;
      const yesH = yesBtn.offsetHeight;

      let x, y, safe = false;

      while (!safe) {
        x = Math.random() * (areaW - noW);
        y = Math.random() * (areaH - noH);

        const overlap =
          x + noW > yesX &&
          x < yesX + yesW &&
          y + noH > yesY &&
          y < yesY + yesH;

        if (!overlap) safe = true;
      }

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    /* Desktop hover */
    noBtn.addEventListener("mouseenter", moveNoButton);

    /* Mobile touch */
    noBtn.addEventListener("touchstart", (e) => {
      e.preventDefault();
      moveNoButton();
    });

    yesBtn.addEventListener("click", () => {
      message.style.display = "block";
    });
  </script>

</body>
</html>
