<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine ❤️</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 30px 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      width: 320px;
    }

    h1 {
      color: #e63946;
    }

    .buttons {
      margin-top: 30px;
      position: relative;
      height: 120px;
    }

    button {
      padding: 12px 25px;
      font-size: 16px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      position: absolute;
    }

    #yesBtn {
      background: #e63946;
      color: white;
      left: 40px;
      top: 40px;
      z-index: 2;
    }

    #noBtn {
      background: #adb5bd;
      color: #333;
      left: 180px;
      top: 40px;
      z-index: 1;
    }

    .message {
      margin-top: 20px;
      font-size: 18px;
      color: #2a9d8f;
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Rushika ❤️</h1>
    <p>Will you be my Valentine? 💖</p>

    <div class="buttons" id="btnArea">
      <button id="yesBtn">Yes 😍</button>
      <button id="noBtn">No 🙄</button>
    </div>

    <div class="message" id="message">
      Yayyy! 💕  
      I knew you’d say YES 😘  
      Happy Valentine’s Day ❤️
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const btnArea = document.getElementById("btnArea");
    const message = document.getElementById("message");

    noBtn.addEventListener("mouseenter", () => {
      const areaRect = btnArea.getBoundingClientRect();
      const yesRect = yesBtn.getBoundingClientRect();
      const noRect = noBtn.getBoundingClientRect();

      let newX, newY;
      let safe = false;

      while (!safe) {
        newX = Math.random() * (areaRect.width - noRect.width);
        newY = Math.random() * (areaRect.height - noRect.height);

        // Check overlap with YES button
        const overlap =
          newX + noRect.width > yesBtn.offsetLeft &&
          newX < yesBtn.offsetLeft + yesBtn.offsetWidth &&
          newY + noRect.height > yesBtn.offsetTop &&
          newY < yesBtn.offsetTop + yesBtn.offsetHeight;

        if (!overlap) {
          safe = true;
        }
      }

      noBtn.style.left = newX + "px";
      noBtn.style.top = newY + "px";
    });

    yesBtn.addEventListener("click", () => {
      message.style.display = "block";
    });
  </script>

</body>
</html>
