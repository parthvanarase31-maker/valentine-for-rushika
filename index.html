<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 360px;
      position: relative;
    }

    h1 {
      color: #e63946;
      margin-bottom: 10px;
    }

    p {
      font-size: 16px;
    }

    .buttons {
      margin-top: 25px;
      position: relative;
      height: 140px;
    }

    button {
      padding: 14px 28px;
      font-size: 16px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      position: absolute;
      touch-action: manipulation;
    }

    #yesBtn {
      background: #e63946;
      color: white;
      left: 20px;
      top: 50px;
      z-index: 2;
    }

    #noBtn {
      background: #adb5bd;
      color: #333;
      left: 190px;
      top: 50px;
      z-index: 1;
    }

    .message {
      margin-top: 15px;
      font-size: 18px;
      color: #2a9d8f;
      display: none;
    }

    /* ❤️ Floating hearts */
    .heart {
      position: fixed;
      bottom: 0;
      font-size: 20px;
      animation: floatUp 4s linear forwards;
      pointer-events: none;
    }

    @keyframes floatUp {
      from { transform: translateY(0); opacity: 1; }
      to { transform: translateY(-100vh); opacity: 0; }
    }

    /* 🎠 Carousel */
    .carousel {
      position: relative;
      margin-top: 20px;
      display: none;
    }

    .slides {
      height: 220px;
    }

    .slide {
      display: none;
    }

    .slide.active {
      display: block;
    }

    .slide img {
      width: 100%;
      height: auto;
      max-height: 220px;
      object-fit: contain;
      border-radius: 15px;
    }

    .slide p {
      font-size: 14px;
      color: #555;
      margin-top: 6px;
    }

    .nav {
      position: absolute;
      top: 40%;
      transform: translateY(-50%);
      background: rgba(230,57,70,0.85);
      color: white;
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      cursor: pointer;
    }

    .nav.left { left: 5px; }
    .nav.right { right: 5px; }

    /* 🎵 Music overlay */
    #musicOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .overlay-content {
      background: white;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
    }

    .overlay-content p {
      color: #e63946;
      font-size: 18px;
      margin-bottom: 15px;
    }

    .overlay-content button {
      padding: 12px 25px;
      border-radius: 25px;
      border: none;
      background: #e63946;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    @media (max-width: 380px) {
      #yesBtn { left: 10px; }
      #noBtn { left: 170px; }
    }
  </style>
</head>
<body>

<!-- 🎵 Music -->
<audio id="bgMusic" loop playsinline>
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_7c9b7a6c9c.mp3" type="audio/mpeg">
</audio>

<!-- 🎵 Music Unlock -->
<div id="musicOverlay">
  <div class="overlay-content">
    <p>Tap to feel the love 💖</p>
    <button id="startMusic">Start 💕</button>
  </div>
</div>

<div class="card">
  <h1>Rushika ❤️</h1>
  <p>Will you be my Valentine? 💖</p>

  <div class="buttons" id="btnArea">
    <button id="yesBtn">Yes 😍</button>
    <button id="noBtn">No 🙄</button>
  </div>

  <div class="message" id="message">
  Somewhere between hello and now,<br>
  you became my favorite part ❤️<br>
  And you still are 💖
  </div>

  <!-- 🎠 Photo Carousel -->
  <div class="carousel" id="carousel">
    <button class="nav left" onclick="prevSlide()">❮</button>

    <div class="slides">
      <div class="slide active">
        <img src="photos/IMG_20221204_215252.jpg">
        <p>Our first memory ❤️</p>
      </div>
      <div class="slide">
        <img src="photos/IMG-20230309-WA0005.jpg">
        <p>That smile I fell for 😊</p>
      </div>
      <div class="slide">
        <img src="photos/IMG20251022084958.jpg">
        <p>Forever us 💕</p>
      </div>
    </div>

    <button class="nav right" onclick="nextSlide()">❯</button>
  </div>
</div>

<script>
  const noBtn = document.getElementById("noBtn");
  const yesBtn = document.getElementById("yesBtn");
  const btnArea = document.getElementById("btnArea");
  const message = document.getElementById("message");
  const carousel = document.getElementById("carousel");
  const music = document.getElementById("bgMusic");

  function moveNoButton() {
    const areaW = btnArea.clientWidth;
    const areaH = btnArea.clientHeight;
    const noW = noBtn.offsetWidth;
    const noH = noBtn.offsetHeight;

    const yesX = yesBtn.offsetLeft;
    const yesY = yesBtn.offsetTop;
    const yesW = yesBtn.offsetWidth;
    const yesH = yesBtn.offsetHeight;

    let x, y, safe = false;

    while (!safe) {
      x = Math.random() * (areaW - noW);
      y = Math.random() * (areaH - noH);

      const overlap =
        x + noW > yesX &&
        x < yesX + yesW &&
        y + noH > yesY &&
        y < yesY + yesH;

      if (!overlap) safe = true;
    }

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
  }

  noBtn.addEventListener("mouseenter", moveNoButton);
  noBtn.addEventListener("touchstart", e => {
    e.preventDefault();
    moveNoButton();
  });

  function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = 20 + Math.random() * 20 + "px";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 4000);
  }

  yesBtn.addEventListener("click", () => {
    message.style.display = "block";
    carousel.style.display = "block";

    for (let i = 0; i < 25; i++) {
      setTimeout(createHeart, i * 120);
    }
  });

  document.getElementById("startMusic").onclick = () => {
    music.play();
    document.getElementById("musicOverlay").style.display = "none";
  };

  /* Carousel logic */
  let currentSlide = 0;
  const slides = document.querySelectorAll(".slide");

  function showSlide(i) {
    slides.forEach(s => s.classList.remove("active"));
    slides[i].classList.add("active");
  }

  function nextSlide() {
    currentSlide = (currentSlide + 1) % slides.length;
    showSlide(currentSlide);
  }

  function prevSlide() {
    currentSlide = (currentSlide - 1 + slides.length) % slides.length;
    showSlide(currentSlide);
  }

  /* Swipe support */
  let startX = 0;
  carousel.addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
  });

  carousel.addEventListener("touchend", e => {
    let endX = e.changedTouches[0].clientX;
    if (startX - endX > 50) nextSlide();
    if (endX - startX > 50) prevSlide();
  });
</script>

</body>
</html>
